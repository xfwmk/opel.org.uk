<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𖦏 opel</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<script>
(() => {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const characters = '01';
  const fontSize = 22;
  const columnSpacing = 35;
  let columns = [];
  let lastFrame = 0;
  let rainColor = '#00ff41';

  window.addEventListener('keydown', (event) => {
    const colors = { b: '#0088ff', r: '#ff2020', g: '#00ff41', w: "#ffffff" };
    const nextColor = colors[event.key.toLowerCase()];
    if (nextColor) rainColor = nextColor;
  });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    columns = Array.from({ length: Math.ceil(innerWidth / columnSpacing) }, () =>
      -Math.random() * innerHeight / fontSize
    );
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
  }

  function draw(time) {
    requestAnimationFrame(draw);
    if (time - lastFrame < 45) return;
    lastFrame = time;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.065)';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.font = `${fontSize}px monospace`;
    for (let i = 0; i < columns.length; i++) {
      const character = characters[Math.floor(Math.random() * characters.length)];
      const y = columns[i] * fontSize;
      ctx.fillStyle = rainColor;
      ctx.fillText(character, i * columnSpacing, y);
      columns[i] += 0.6 + (i % 5) * 0.11;
      if (y > innerHeight + Math.random() * 400) columns[i] = -Math.random() * 40;
    }
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

const MUSIC_FILE = "matrix.mp3"; 

const music = new Audio(MUSIC_FILE);
music.loop = true;
music.volume = 0.5;

document.addEventListener("keydown", async (event) => {
  if (event.key.toLowerCase() === "p" && !event.repeat) {
    if (music.paused) {
      try {
        await music.play();
      } catch (error) {
        console.error("Could not play music:", error);
      }
    } else {
      music.pause();
    }
  }
});
</script>
</body>
</html>
