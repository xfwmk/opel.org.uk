<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>𖦏 opel | Pipes</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    font-family: monospace;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>

<body>
<canvas id="pipes"></canvas>

<script>
(() => {
  const canvas = document.getElementById("pipes");
  const ctx = canvas.getContext("2d", { alpha: false });

  const sets = [
    "┃┏ ┓┛━┓  ┗┃┛┗ ┏━",
    "│╭ ╮╯─╮  ╰│╯╰ ╭─",
    "│┌ ┐┘─┐  └│┘└ ┌─",
    "║╔ ╗╝═╗  ╚║╝╚ ╔═",
    "|+ ++-+  +|++ +-",
    "|/ \\/-\\  \\|/\\ /-",
    ".. ....  .... ..",
    ".o oo.o  o.oo o.",
    "-\\ /\\|/  /-\\/ \\|",
    "╿┍ ┑┚╼┒  ┕╽┙┖ ┎╾"
  ];

  const colors = [
    "#ffffff",
    "#ffffff",
    "#ffffff",
    "#ffffff",
    "#ffffff",
    "#ffffff",
    "#ffffff"
  ];

  const config = {
    pipes: 3,
    fps: 75,
    straightProbability: 13,
    resetAfter: 2000,
    pipeType: 0,
    fontSize: 18,
    bold: true,
    randomStart: true
  };

  let cols = 0;
  let rows = 0;
  let pipes = [];
  let steps = 0;
  let paused = false;
  let lastFrame = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textBaseline = "top";
    ctx.font =
      `${config.bold ? "bold " : ""}${config.fontSize}px monospace`;

    const cellWidth = config.fontSize * 0.65;
    const cellHeight = config.fontSize * 1.15;

    cols = Math.max(1, Math.floor(innerWidth / cellWidth));
    rows = Math.max(1, Math.floor(innerHeight / cellHeight));

    config.cellWidth = cellWidth;
    config.cellHeight = cellHeight;

    reset();
  }

  function reset() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, innerWidth, innerHeight);

    steps = 0;
    pipes = [];

    for (let i = 0; i < config.pipes; i++) {
      pipes.push({
        x: config.randomStart
          ? Math.floor(Math.random() * cols)
          : Math.floor(cols / 2),

        y: config.randomStart
          ? Math.floor(Math.random() * rows)
          : Math.floor(rows / 2),

        direction: config.randomStart
          ? Math.floor(Math.random() * 4)
          : 0,

        color: colors[i % colors.length],
        type: config.pipeType
      });
    }
  }

  function drawPipe(pipe) {
    const oldDirection = pipe.direction;

    switch (oldDirection) {
      case 0: pipe.y--; break;
      case 1: pipe.x++; break;
      case 2: pipe.y++; break;
      case 3: pipe.x--; break;
    }

    const wrapped =
      pipe.x < 0 ||
      pipe.x >= cols ||
      pipe.y < 0 ||
      pipe.y >= rows;

    pipe.x = (pipe.x + cols) % cols;
    pipe.y = (pipe.y + rows) % rows;

    if (wrapped) {
      pipe.color = colors[
        Math.floor(Math.random() * colors.length)
      ];
    }

    let newDirection = oldDirection;

    if (
      Math.floor(
        Math.random() * config.straightProbability
      ) === 0
    ) {
      const turn = Math.random() < 0.5 ? -1 : 1;
      newDirection = (oldDirection + turn + 4) % 4;
    }

    const index = oldDirection * 4 + newDirection;
    const character = [...sets[pipe.type]][index] || " ";

    ctx.fillStyle = pipe.color;
    ctx.fillText(
      character,
      pipe.x * config.cellWidth,
      pipe.y * config.cellHeight
    );

    pipe.direction = newDirection;
  }

  function animate(timestamp) {
    requestAnimationFrame(animate);

    if (paused) {
      lastFrame = timestamp;
      return;
    }

    const interval = 1000 / config.fps;

    if (timestamp - lastFrame < interval) return;

    lastFrame = timestamp;

    for (const pipe of pipes) {
      drawPipe(pipe);
    }

    steps += pipes.length;

    if (
      config.resetAfter > 0 &&
      steps >= config.resetAfter
    ) {
      reset();
    }
  }

  window.addEventListener("resize", resize);

  window.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
      event.preventDefault();
      paused = !paused;
    }

    if (event.key.toLowerCase() === "r") {
      reset();
    }

    if (event.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    if (event.key === "ArrowUp") {
      event.preventDefault();
      config.fps = Math.min(100, config.fps + 5);
    }

    if (event.key === "ArrowDown") {
      event.preventDefault();
      config.fps = Math.max(20, config.fps - 5);
    }

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      config.straightProbability = Math.max(
        5,
        config.straightProbability - 1
      );
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      config.straightProbability = Math.min(
        15,
        config.straightProbability + 1
      );
    }
  });

  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
