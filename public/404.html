  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #101010; color: #fff; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #101010; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, summary:focus-visible { outline: 2px solid #a6c9ee; outline-offset: 4px; }
    .skip-link { position: fixed; top: -80px; left: 12px; z-index: 100; padding: 12px; background: #152741; }
    .skip-link:focus { top: 8px; }
    .opel-header { position: sticky; top: 0; z-index: 50; background: #101010; }
    .opel-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; padding: 0 16px 0 28px; }
    .opel-brand { justify-self: start; font-size: 28px; font-weight: 650; white-space: nowrap; }
    .opel-nav { display: flex; align-items: center; gap: 4px; }
    .opel-nav details { position: relative; }
    .opel-nav summary { display: flex; align-items: center; gap: 8px; padding: 5px 10px; line-height: 1.25; font-size: 16px; font-weight: 500; border-radius: 6px; cursor: pointer; list-style: none; box-shadow: inset 0 0 0 1px transparent; }
    .opel-nav summary::-webkit-details-marker { display: none; }
    .opel-nav summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid #aeb9c7; border-bottom: 1.5px solid #aeb9c7; transform: translateY(-2px) rotate(45deg); }
    .opel-nav details[open] summary::after { transform: translateY(2px) rotate(225deg); }
    .opel-nav summary:hover, .opel-nav details[open] summary { box-shadow: inset 0 0 0 1px #777; }
    .opel-nav details[open]::after { content: ""; position: absolute; top: 100%; left: 0; right: 0; height: 6px; }
    .opel-dropdown { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: min(480px, calc(100vw - 24px)); padding: 10px; border: 1px solid #383838; border-radius: 12px; background: #101216; box-shadow: 0 14px 30px #0007; transform-origin: top center; }
    .opel-dropdown.compact { grid-template-columns: 1fr; width: 180px; }
    .opel-dropdown a, .opel-dropdown .placeholder { display: block; padding: 10px 12px; border: 1px solid #444; border-radius: 7px; font-size: 14px; overflow-wrap: anywhere; }
    .opel-dropdown .placeholder { color: #9da8b8; }
    .opel-dropdown a:hover { border-color: #777; background: #222; }
    .opel-dashboard, .action { display: inline-flex; align-items: center; justify-content: center; border: 1px solid #414955; border-radius: 999px; background: #101010; font-size: 14px; font-weight: 550; }
    .opel-dashboard { justify-self: end; padding: 8px 14px; }
    .opel-dashboard:hover, .action:hover { border-color: #94b6da; background: #162338; }
    #main-content { position: relative; isolation: isolate; min-height: calc(100svh - 72px); overflow: hidden; display: grid; place-items: center; padding: 60px 24px 80px; background: radial-gradient(ellipse 50% 55% at 50% 43%, #0c1e36 0%, #10101000 90%); }
    #floating-dots { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
    .error-panel { width: min(100%, 920px); text-align: center; }
    .error-panel h1 { margin: 0 0 18px; color: #fff; font-size: clamp(28px, 4vw, 42px); line-height: 1.1; font-weight: 600; letter-spacing: -0.035em; }
    .error-description { max-width: 580px; margin: 0 auto; color: #b8c4d4; font-size: 17px; line-height: 1.6; text-wrap: balance; }
    .error-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    .action { padding: 13px 24px; }
    .action.primary { background: #142b49; border-color: #42658d; }
    .action.primary:hover { background: #1c3a60; border-color: #a6c9ee; }
    .error-rule { width: min(100%, 1480px); position: absolute; left: 50%; transform: translateX(-50%); border-top: 1px dashed #2d3440; pointer-events: none; }
    .error-rule.top { top: 6px; }
    .error-rule.bottom { bottom: 12px; }
    @media (prefers-reduced-motion: no-preference) {
      .opel-nav summary { transition: box-shadow 160ms ease; }
      .opel-nav summary::after { transition: transform 160ms ease; }
      .opel-nav details[open] .opel-dropdown { animation: panel-in 180ms ease-out both; }
      .opel-nav details[data-closing] .opel-dropdown { animation: panel-out 120ms ease-in both; pointer-events: none; }
      .opel-dropdown a, .action, .opel-dashboard { transition: border-color 180ms ease, background-color 180ms ease, transform 180ms ease; }
      .action:hover, .opel-dashboard:hover { transform: translateY(-2px); }
      .action:active, .opel-dashboard:active { transform: translateY(1px); }
      @keyframes panel-in { from { opacity: 0; translate: 0 -6px; scale: .98; } to { opacity: 1; translate: 0 0; scale: 1; } }
      @keyframes panel-out { to { opacity: 0; translate: 0 -4px; scale: .98; } }
    }
    @media (max-width: 600px) {
      .opel-bar { height: auto; min-height: 92px; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
      .opel-brand { font-size: 24px; }
      .opel-nav { grid-row: 2; grid-column: 1 / -1; justify-content: center; }
      .opel-dashboard { grid-row: 1; grid-column: 2; }
      .opel-nav details { position: static; }
      .opel-dropdown, .opel-nav .opel-dropdown.compact { top: 100%; left: 50%; width: min(320px, calc(100vw - 24px)); transform: translateX(-50%); }
      .opel-nav details[open]::after { display: none; }
      #main-content { min-height: calc(100svh - 100px); padding: 48px 18px 64px; }
      .error-description { font-size: 16px; }
    }
    .error-panel h1 {
      font-size: clamp(120px, 22vw, 260px);
      line-height: 1;
      text-align: center;
      margin-bottom: 24px;
    }

    :root,
    body,
    .opel-header,
    #main-content {
      background-color: #0a0a0a;
    }

    .opel-header .opel-nav details:nth-child(2) > .opel-dropdown {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-flow: row;
      width: 110px;
      max-width: calc(100vw - 24px);
      gap: 6px;
      padding: 10px;
    }

    .opel-nav details:nth-child(2) > .opel-dropdown a {
      display: block;
      width: 100%;
      margin: 0;
      padding: 10px 12px;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    
    body {
      isolation: isolate;
    }

    #floating-dots {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
    }

    #main-content {
      background-color: transparent;
    }
  </style>
</head>
<body>
  <canvas id="floating-dots" aria-hidden="true"></canvas>
  <header class="opel-header">
    <div class="opel-bar">
      <a class="opel-brand" href="./" aria-label="opel home">𖦏 opel</a>

      <nav class="opel-nav" aria-label="Main navigation">

  <main id="main-content" tabindex="-1">
    <canvas id="floating-dots" aria-hidden="true"></canvas>

    <section class="error-panel" aria-labelledby="error-title">
      <h1 id="error-title" aria-label="404 — Page not found">404</h1>

  <script>
    (() => {
      const nav = document.querySelector('.opel-nav');
      const menus = [...nav.querySelectorAll('details')];
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let leaveTimer, fadeTimer;
      function cancelClose() {
        clearTimeout(leaveTimer);
        clearTimeout(fadeTimer);
        menus.forEach(menu => delete menu.dataset.closing);
      }
      function openMenu(selected) {
        cancelClose();
        menus.forEach(menu => { menu.open = menu === selected; });
      }
      function closeMenu(animate = true) {
        cancelClose();
        const menu = menus.find(item => item.open);
        if (!menu) return;
        if (!animate || reduced.matches) { menu.open = false; return; }
        menu.dataset.closing = '';
        fadeTimer = setTimeout(() => { menu.open = false; delete menu.dataset.closing; }, 120);
      }
      menus.forEach(menu => {
        const summary = menu.querySelector('summary');
        summary.addEventListener('pointerenter', event => {
          if (event.pointerType === 'mouse') openMenu(menu);
        });
        summary.addEventListener('click', event => {
          event.preventDefault();
          if (menu.open) closeMenu(); else openMenu(menu);
        });
      });
      nav.addEventListener('pointerenter', cancelClose);
      nav.addEventListener('pointerleave', event => {
        if (event.pointerType !== 'mouse' || nav.querySelector('.opel-dropdown :focus-visible')) return;
        leaveTimer = setTimeout(closeMenu, 110);
      });
      document.addEventListener('pointerdown', event => { if (!nav.contains(event.target)) closeMenu(); });
      document.addEventListener('focusin', event => { if (nav.contains(event.target)) cancelClose(); else closeMenu(false); });
      document.addEventListener('keydown', event => {
        const menu = menus.find(item => item.open);
        if (event.key !== 'Escape' || !menu) return;
        if (nav.contains(document.activeElement)) menu.querySelector('summary').focus();
        closeMenu(false);
      });
    })();

    (() => {
      const canvas = document.querySelector('#floating-dots');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let dots = [], width, height, frame, lastTime;

      function draw(now, dt) {
        ctx.clearRect(0, 0, width, height);
        const time = reduced.matches ? 0 : now / 1000;
        for (const dot of dots) {
          dot.x = (dot.x + dot.vx * dt + width) % width;
          dot.y = (dot.y + dot.vy * dt + height) % height;
          ctx.fillStyle = `rgba(72,72,72,${0.35 + (1 + Math.sin(time * 0.4 + dot.phase)) * 0.25})`;
          ctx.beginPath();
          ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function tick(now) {
        draw(now, Math.min((now - lastTime) / 1000, 0.05));
        lastTime = now;
        frame = requestAnimationFrame(tick);
      }

      function refresh() {
        cancelAnimationFrame(frame);
        draw(performance.now(), 0);
        if (reduced.matches || document.hidden) return;
        lastTime = performance.now();
        frame = requestAnimationFrame(tick);
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        const ratio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        dots = Array.from({ length: Math.min(140, Math.ceil(width * height / 8000)) }, () => ({
          x: Math.random() * width, y: Math.random() * height,
          vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
          radius: 0.7 + Math.random() * 1.2, phase: Math.random() * Math.PI * 2
        }));
        refresh();
      }

      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', refresh);
      reduced.addEventListener('change', refresh);
      resize();
    })();
  </script>
</body>
