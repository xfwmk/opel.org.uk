<!doctype html>
<html lang="es" class="font-stk-bureau-sans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  
  <title>𖦏 opel | Español</title>
  <link rel="stylesheet" href="assets/_separator.BAUrGshG.css">
  <link rel="stylesheet" href="assets/index.Cm-titPL.css">
  <link rel="stylesheet" href="assets/index.CN3UJUeJ.css">

  <style>
    :root {
      color-scheme: dark;
      background: #0a0a0a;
      color: #fff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: #0a0a0a;
      color: #fff;
    }

    .opel-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #0a0a0a;
      color: #fff;
    }

    .opel-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 1480px;
      height: 72px;
      margin-inline: auto;
      padding-inline: clamp(12px, 2vw, 28px);
    }

    .opel-brand,
    .opel-dropdown a,
    .opel-dashboard,
    .opel-cta {
      color: #fff;
      text-decoration: none;
    }

    .opel-brand {
      justify-self: start;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 650;
      white-space: nowrap;
    }

    .opel-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .opel-nav details {
      position: relative;
    }

    .opel-nav summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      list-style: none;
    }

    .opel-nav summary::-webkit-details-marker {
      display: none;
    }

    .opel-nav summary::after {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 1.5px solid;
      border-bottom: 1.5px solid;
      transform: translateY(-2px) rotate(45deg);
    }

    .opel-nav details[open] summary::after {
      transform: translateY(2px) rotate(225deg);
    }

    .opel-nav summary:hover,
    .opel-nav details[open] summary,
    .opel-dropdown a:hover,
    .opel-dropdown a:focus-visible {
      background: #222;
    }

    .opel-dropdown {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      width: 180px;
      padding: 5px;
      border: 1px solid #383838;
      border-radius: 12px;
      background: #0b0b0b;
      box-shadow: 0 12px 32px rgb(0 0 0 / 40%);
    }

    .opel-dropdown a {
      display: block;
      padding: 10px 12px;
      border-radius: 7px;
    }

    .opel-dashboard,
    .opel-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #555;
      border-radius: 999px;
      background: #0a0a0a;
      font-weight: 550;
    }

    .opel-dashboard {
      justify-self: end;
      padding: 8px 14px;
    }

    .opel-dashboard:hover,
    .opel-cta:hover {
      border-color: #fff;
      background: #0a0a0a;
    }

    :is(a, summary):focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    #main-content {
      padding: 8px 8px 12px;
      background: #0a0a0a;
    }

    .opel-hero {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      overflow: hidden;
      max-width: 1480px;
      min-height: 720px;
      margin-inline: auto;
      padding: 64px 24px;
      border-radius: 16px;
      color: #fff;
      background-color: #08152e;
      background-image:
        radial-gradient(ellipse 25% 15% at 50% 103%,
          #ecf8ff 0%, #a8d9ff 30%, rgb(87 166 255 / 72%) 54%,
          transparent 100%),
        radial-gradient(ellipse 54% 65% at 50% 112%,
          #367aca 0%, #204c88 35%, rgb(25 58 105 / 55%) 64%,
          transparent 100%);
      box-shadow: inset 0 2px 8px rgb(158 202 255 / 16%);
    }

    .opel-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(
        ellipse 1px 1.6px at center,
        rgb(255 244 191 / 50%) 30%,
        transparent 100%
      );
      background-size: 6px 8px;
      mask-image: radial-gradient(
        ellipse 63% 94% at 50% 100%,
        #000 0%, rgb(0 0 0 / 55%) 49%, transparent 100%
      );
    }

    .opel-hero-content {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: clamp(24px, 3vw, 40px);
      width: 100%;
      text-align: center;
    }

    .opel-hero h1 {
      max-width: 1080px;
      margin: 0;
      color: #fff;
      font-size: clamp(40px, 4.3vw, 64px);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1.04;
      text-wrap: balance;
    }

    .opel-hero p {
      max-width: 700px;
      margin: 0;
      color: #fff;
      font-size: clamp(17px, 1.4vw, 21px);
      line-height: 1.3;
      text-wrap: balance;
    }

    .opel-cta {
      margin-top: 8px;
      padding: 14px 24px;
      border-color: transparent;
    }

    @media (max-width: 47.999rem) {
      .opel-bar {
        display: flex;
        justify-content: space-between;
        height: 54px;
        padding-inline: 10px;
      }

      .opel-nav { gap: 0; }
      .opel-nav summary { padding-inline: 7px; }
      .opel-dashboard { padding: 6px 10px; }

      .opel-dropdown {
        left: 50%;
        transform: translateX(-50%);
      }

      #main-content { padding: 4px; }

      .opel-hero {
        min-height: 600px;
        padding-inline: 20px;
        border-radius: 12px;
      }
    }
      @media (prefers-reduced-motion: no-preference) {
      .opel-dashboard,
      .opel-cta {
        transition: transform 180ms ease, box-shadow 180ms ease,
                    background-color 180ms ease, border-color 180ms ease;
      }

      .opel-nav summary {
        position: relative;
      }

      .opel-nav summary::before {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 3px;
        height: 2px;
        border-radius: 2px;
        background: #9ecfff;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 180ms ease;
      }

      .opel-nav summary::after {
        transition: transform 180ms ease;
      }

      .opel-nav details[open] summary::before,
      .opel-nav summary:focus-visible::before {
        transform: scaleX(1);
      }

      .opel-dropdown a {
        transition: padding-left 160ms ease, background-color 160ms ease;
      }

      @media (hover: hover) {
        .opel-dashboard:hover,
        .opel-cta:hover {
          transform: translateY(-2px);
          box-shadow: 0 4px 16px rgb(90 165 255 / 24%);
        }

        .opel-nav summary:hover::before {
          transform: scaleX(1);
        }

        .opel-dropdown a:hover {
          padding-left: 16px;
        }
      }

      .opel-dashboard:active,
      .opel-cta:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .opel-nav details[open] > .opel-dropdown {
        transform-origin: top center;
        animation: opel-menu-open 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .opel-nav details[open] > .opel-dropdown > a {
        animation: opel-link-in 180ms ease-out 45ms backwards;
      }

      .opel-nav details[open] > .opel-dropdown > a:nth-child(2) {
        animation-delay: 80ms;
      }

      @keyframes opel-menu-open {
        from {
          opacity: 0;
          translate: 0 -7px;
          scale: 0.98 0.9;
        }
        to {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }
      }

      @keyframes opel-link-in {
        from {
          opacity: 0;
          translate: 0 -4px;
        }
        to {
          opacity: 1;
          translate: 0 0;
        }
      }
    }

    .opel-nav .opel-dropdown {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      width: min(30rem, calc(100vw - 24px));
      left: 50%;
      transform: translateX(-50%);
    }

    .opel-nav .opel-dropdown a {
      overflow-wrap: anywhere;
    }

    .opel-nav .opel-dropdown:not(:has(> a:nth-child(3))) {
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      grid-auto-flow: column;
      width: max-content;
      max-width: calc(100vw - 24px);
    }

    @media (max-width: 47.999rem) {
      .opel-nav details {
        position: static;
      }

      .opel-nav .opel-dropdown {
        top: 100%;
      }
    }

    .opel-dropdown a {
      border: 0.5px solid #444;
    }

    .opel-dropdown a:hover,
    .opel-dropdown a:focus-visible {
      border-color: #777;
    }
  </style>
</head>

<body>
  <header class="opel-header">
    <div class="opel-bar">
      <a class="opel-brand" href="./" aria-label="opel home">𖦏 opel</a>

      <nav class="opel-nav" aria-label="Main navigation">
        <details name="opel-navigation">
          <summary>Enlaces</summary>
          <div class="opel-dropdown">
            <a href="opel.org.uk/links">Links</a>
            <a href="opel.org.uk/languages">Languages</a>
            <a href="dash.opel.org.uk">Dashboard</a>
            <a href="opel.org.uk/lyrics">Lyrics</a>
            <a href="lab.opel.org.uk">Lab</a>
            <a href="opel.org.uk/map">Map</a>
          </div>
        </details>

        <details name="opel-navigation">
          <summary>Información</summary>
          <div class="opel-dropdown">
            <a href="opel.org.uk/info">Info</a>
          </div>
        </details>
      </nav>

      <a class="opel-dashboard" href="https://dash.opel.org.uk">Dashboard</a>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <section id="home-hero" class="opel-hero" aria-labelledby="hero-title">
      <div class="opel-hero-content">
        <h1 id="hero-title">opel.org.uk</h1>

        <p>
          Una plataforma para mi información y mis proyectos.<br>
          Alojado y ejecutado completamente por mí con cloudflare.
        </p>

        <a class="opel-cta" href="https://opel.org.uk/info">
          Comienza a explorar el sitio
        </a>
      </div>
    </section>
  </main>

  <script>
    const navigation = document.querySelector(".opel-nav");

    function closeDropdown() {
      const openMenu = navigation.querySelector("details[open]");
      if (openMenu) openMenu.open = false;
    }

    document.addEventListener("click", (event) => {
      if (!navigation.contains(event.target) || event.target.closest("a")) {
        closeDropdown();
      }
    });

    document.addEventListener("focusin", (event) => {
      if (!navigation.contains(event.target)) closeDropdown();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;

      const openMenu = navigation.querySelector("details[open]");
      if (openMenu) {
        openMenu.open = false;
        openMenu.querySelector("summary").focus();
      }
    });
  </script>
</body>
</html>
