<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>opel.org.uk</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #ffffff;
      --muted: #888888;
      --card: #0b0b0b;
      --blue: #173f6d;
      --blue-hover: #285d96;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      padding: 30px 28px 60px;
      background: #000000;
    }

    .brand {
      display: block;
      width: fit-content;

      color: #ffffff;
      text-decoration: none;

      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .brand:hover,
    .brand:focus-visible {
      opacity: 0.7;
    }

    main {
      padding-top: 30px;
    }

    .links {
      width: 365px;
      max-width: 100%;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;

      width: 100%;
      min-height: 104px;

      padding: 22px 20px;

      color: #ffffff;
      background: var(--card);

      border: 3px solid var(--blue);
      border-radius: 18px;

      text-decoration: none;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      background: #121212;
      border-color: var(--blue-hover);
      transform: translateY(-2px);
      outline: none;
    }

    .link-card:active {
      transform: translateY(0);
    }

    .icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
    }

    .icon img {
      display: block;
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .simple-icon {
      filter: brightness(0) invert(1);
    }

    .guns-logo {
      width: 34px !important;
      height: 34px !important;
      object-fit: contain;
      filter:
        grayscale(1)
        brightness(0)
        invert(1);
    }

    .details {
      min-width: 0;

      display: flex;
      flex-direction: column;
    }

    .site-name {
      margin-bottom: 4px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .username {
      overflow: hidden;

      color: #ffffff;

      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 20px 50px;
      }

      .brand {
        font-size: 22px;
      }

      main {
        padding-top: 24px;
      }

      .links {
        width: 100%;
      }

      .link-card {
        min-height: 94px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a
      class="brand"
      href="https://opel.org.uk/"
    >
      opel.org.uk
    </a>

    <main>
      <section class="links" aria-label="Social links">

        <!-- Steam -->
        <a
          class="link-card"
          href="https://steamcommunity.com/id/opelascona"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="simple-icon"
              src="https://cdn.simpleicons.org/steam/ffffff"
              alt="Steam"
            >
          </span>

          <span class="details">
            <span class="site-name">Steam</span>
            <span class="username">opelascona</span>
          </span>
        </a>

        <!-- FACEIT -->
        <a
          class="link-card"
          href="https://www.faceit.com/es/players/opel"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="simple-icon"
              src="https://cdn.simpleicons.org/faceit/ffffff"
              alt="FACEIT"
            >
          </span>

          <span class="details">
            <span class="site-name">FACEIT</span>
            <span class="username">opel</span>
          </span>
        </a>

        <!-- GitHub -->
        <a
          class="link-card"
          href="https://github.com/xfwmk"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="simple-icon"
              src="https://cdn.simpleicons.org/github/ffffff"
              alt="GitHub"
            >
          </span>

          <span class="details">
            <span class="site-name">GitHub</span>
            <span class="username">xfwmk</span>
          </span>
        </a>

        <!-- guns.lol -->
        <a
          class="link-card"
          href="https://guns.lol/opelascona"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="guns-logo"
              src="https://assets.guns.lol/guns_logo_no_background_cropped.png"
              alt="guns.lol"
            >
          </span>

          <span class="details">
            <span class="site-name">guns.lol</span>
            <span class="username">opelascona</span>
          </span>
        </a>

        <!-- TikTok -->
        <a
          class="link-card"
          href="https://tiktok.com/@opel6666"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="simple-icon"
              src="https://cdn.simpleicons.org/tiktok/ffffff"
              alt="TikTok"
            >
          </span>

          <span class="details">
            <span class="site-name">TikTok</span>
            <span class="username">opel6666</span>
          </span>
        </a>

      </section>
    </main>

  </div>

</body>
</html>
