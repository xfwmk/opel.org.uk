<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>opel.org.uk</title>

  <style>
    :root {
      color-scheme: dark;
      --page: #000000;
      --text: #ffffff;
      --muted: #a8a8a8;
      --card: #0b0b0b;
      --card-border: #173b66;
      --card-hover: #151515;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      min-height: 100vh;
      width: 100%;
      background: #000000;
      color: var(--text);
    }

    header {
      padding: 30px 34px;
    }

    .brand {
      display: inline-block;
      color: var(--text);
      text-decoration: none;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand:hover,
    .brand:focus-visible {
      opacity: 0.7;
    }

    main {
      display: flex;
      justify-content: flex-start;
      padding: 72px 28px 80px;
    }

    .links {
      width: min(100%, 365px);
      display: grid;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;

      width: 100%;
      min-height: 104px;
      padding: 22px 20px;

      color: var(--text);
      background: var(--card);

      border: 3px solid var(--card-border);
      border-radius: 18px;

      text-decoration: none;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      background: var(--card-hover);
      border-color: #285b91;
      transform: translateY(-1px);
      outline: none;
    }

    .icon {
      display: grid;
      place-items: center;

      flex: 0 0 48px;
      width: 48px;
      height: 48px;

      color: #ffffff;
      background: transparent;
      border-radius: 12px;
    }

    .icon svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .guns-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #ffffff;
      object-fit: contain;
      padding: 3px;
    }

    .details {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .site-name {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .username {
      overflow: hidden;
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      main {
        padding: 52px 20px 60px;
      }

      .links {
        width: 100%;
      }

      .link-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <header>
      <a class="brand" href="https://opel.org.uk/">
        opel.org.uk
      </a>
    </header>

    <main>
      <section class="links" aria-label="Social links">

        <!-- Steam -->
        <a
          class="link-card"
          href="https://steamcommunity.com/id/opelascona"

            </svg>

          <span class="details">

        <!-- FACEIT -->

            </svg>
          </span>

          <span class="details">
            <span class="site-name">GitHub</span>
            <span class="username">xfwmk</span>

        </a>

        <!-- guns.lol -->

        >
          <span class="icon" aria-hidden="true">
            <img

        </a>

      </section>
    </main>

  </div>
</body>
</html>
