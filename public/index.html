<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>opel.org.uk</title>

  <style>
    :root {
      --background: #000;
      --text: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 28px;
    }

    a {
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
  </style>
</head>

<body>
  <header>
    <a href="https://opel.org.uk/">opel.org.uk</a>
  </header>
</body>
</html>
