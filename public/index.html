<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>opel.org.uk</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #ffffff;
      --muted: #888888;
      --card: #0b0b0b;
      --grey: #666666;
      --grey-hover: #999999;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        #000000
        url("https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwallpapers.com%2Fimages%2Fhd%2Fabstract-black-grey-waves-background-shkpekaewx4mtd1k.jpg&f=1&nofb=1&ipt=54912c348bdb3d5c3b35a524b865013ea72a07a7129b5bd230835dc65f7378a4&ipo=images")
        center center / cover fixed no-repeat;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      padding: 30px 40px 60px;
    }

    .brand {
      display: block;
      width: fit-content;
      color: #ffffff;
      text-decoration: none;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .brand:hover,
    .brand:focus-visible {
      opacity: 0.7;
    }

    main {
      display: grid;
      grid-template-columns: 365px minmax(0, 1fr);
      gap: 50px;
      width: 100%;
      max-width: 1200px;
      padding-top: 30px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-height: 104px;
      padding: 22px 20px;
      color: #ffffff;
      background: rgba(11, 11, 11, 0.92);
      border: 3px solid var(--grey);
      border-radius: 18px;
      text-decoration: none;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      background: rgba(18, 18, 18, 0.95);
      border-color: var(--grey-hover);
      transform: translateY(-2px);
      outline: none;
    }

    .link-card:active {
      transform: translateY(0);
    }

    .icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .icon svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .guns-icon {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter:
        grayscale(1)
        brightness(0)
        invert(1);
    }

    .details {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .site-name {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .username {
      overflow: hidden;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .right-column {
      min-width: 0;
      width: 100%;
    }

    .about {
      margin-bottom: 28px;
      padding: 24px;
      background: rgba(11, 11, 11, 0.92);
      border: 3px solid var(--grey);
      border-radius: 18px;
    }

    .about-title {
      margin: 0 0 18px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .about-name {
      margin-bottom: 18px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .about-item {
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .about-label {
      margin-bottom: 5px;
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .about-value {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
    }

    .interests {
      grid-column: 1 / -1;
    }

    .repos-title {
      margin: 0 0 14px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .repo-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .repo-card {
      display: block;
      min-height: 120px;
      padding: 20px;
      color: #ffffff;
      background: rgba(11, 11, 11, 0.92);
      border: 3px solid var(--grey);
      border-radius: 18px;
      text-decoration: none;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .repo-card:hover,
    .repo-card:focus-visible {
      background: rgba(18, 18, 18, 0.95);
      border-color: var(--grey-hover);
      transform: translateY(-2px);
      outline: none;
    }

    .repo-name {
      overflow: hidden;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-description {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .repo-meta {
      margin-top: 12px;
      color: #666666;
      font-size: 12px;
    }

    .loading {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 850px) {
      .page {
        padding: 25px 25px 50px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .repo-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 20px 50px;
      }

      .brand {
        font-size: 22px;
      }

      main {
        padding-top: 24px;
      }

      .repo-list {
        grid-template-columns: 1fr;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .interests {
        grid-column: auto;
      }

      .link-card {
        min-height: 94px;
        padding: 18px;
      }

      .repo-card {
        min-height: 94px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a class="brand" href="https://opel.org.uk/">
      opel.org.uk
    </a>

    <main>

      <section class="links" aria-label="Social links">

        <a
          class="link-card"
          href="https://steamcommunity.com/id/opelascona"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="simple-icon"
              src="https://cdn.simpleicons.org/steam/ffffff"
              alt="Steam"
            >
          </span>

          <span class="details">
            <span class="site-name">Steam</span>
            <span class="username">opelascona</span>
          </span>
        </a>

        <a
          class="link-card"
          href="https://www.faceit.com/es/players/opel"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">
            <img
              class="simple-icon"
              src="https://cdn.simpleicons.org/faceit/ffffff"
              alt="FACEIT"
            >
          </span>

          <span class="details">
            <span class="site-name">FACEIT</span>
            <span class="username">opel</span>
          </span>
        </a>

        <a
          class="link-card"
          href="https://github.com/xfwmk"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path fill-rule="evenodd" d="M16 3.1A12.9 12.9 0 0 0 11.9 28c.65.12.89-.28.89-.62v-2.2c-3.62.79-4.39-1.54-4.39-1.54-.59-1.5-1.44-1.9-1.44-1.9-1.18-.81.09-.8.09-.8 1.3.1 1.98 1.34 1.98 1.34 1.16 1.98 3.04 1.41 3.78 1.08.12-.84.45-1.42.82-1.75-2.89-.33-5.92-1.45-5.92-6.45 0-1.43.51-2.59 1.34-3.5-.14-.33-.58-1.66.13-3.46 0 0 1.09-.35 3.58 1.34a12.3 12.3 0 0 1 6.52 0c2.49-1.69 3.58-1.34 3.58-1.34.71 1.8.27 3.13.13 3.46.83.91 1.34 2.07 1.34 3.5 0 5.01-3.04 6.11-5.94 6.44.47.41.89 1.2.89 2.42v3.58c0 .34.24.75.9.62A12.9 12.9 0 0 0 16 3.1Z" clip-rule="evenodd"/>
            </svg>
          </span>

          <span class="details">
            <span class="site-name">GitHub</span>
            <span class="username">xfwmk</span>
          </span>
        </a>

        <a
          class="link-card"
          href="https://guns.lol/opelascona"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon" aria-hidden="true">
            <img
              class="guns-icon"
              src="https://www.google.com/s2/favicons?domain=guns.lol&sz=128"
              alt=""
            >
          </span>

          <span class="details">
            <span class="site-name">guns.lol</span>
            <span class="username">opelascona</span>
          </span>
        </a>

        <a
          class="link-card"
          href="https://tiktok.com/@opel6666"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M19.2 4h4.2c.3 2.7 1.7 4.6 4.6 5.1v4.1c-1.7 0-3.2-.5-4.6-1.3v7.8c0 5.1-3.1 8.2-7.7 8.2-4.2 0-7.1-2.8-7.1-6.7 0-4.1 3.1-6.9 7.4-6.9.5 0 1 .1 1.4.1v4.2c-.4-.1-.8-.2-1.3-.2-1.9 0-3.2 1.1-3.2 2.8 0 1.6 1.1 2.7 2.7 2.7 1.8 0 3.6-1.1 3.6-4V4Z"/>
            </svg>
          </span>

          <span class="details">
            <span class="site-name">TikTok</span>
            <span class="username">opel6666</span>
          </span>
        </a>

      </section>

      <section class="right-column" aria-label="About me and GitHub repositories">

        <section class="about" aria-label="About me">

          <h2 class="about-title">About me</h2>

          <div class="about-name">Kian Rega</div>

          <div class="about-grid">

            <div class="about-item">
              <div class="about-label">Age</div>
              <div class="about-value" id="age"></div>
            </div>

            <div class="about-item">
              <div class="about-label">Nationality</div>
              <div class="about-value">Spanish</div>
            </div>

            <div class="about-item interests">
              <div class="about-label">Interests</div>
              <div class="about-value">
                Coding · Linux · Counter-Strike
              </div>
            </div>

          </div>
        </section>

        <h2 class="repos-title">Repos</h2>

        <div class="repo-list" id="repo-list">
          <div class="loading">Loading repositories...</div>
        </div>

      </section>

    </main>

  </div>

  <script>
    function updateAge() {
      const birthDate = new Date(2011, 1, 16);
      const today = new Date();

      let age = today.getFullYear() - birthDate.getFullYear();

      const birthdayThisYear = new Date(
        today.getFullYear(),
        birthDate.getMonth(),
        birthDate.getDate()
      );

      if (today < birthdayThisYear) {
        age--;
      }

      document.getElementById("age").textContent = age;
    }

    async function loadRepos() {
      const list = document.getElementById("repo-list");

      try {
        const response = await fetch(
          "https://api.github.com/users/xfwmk/repos?sort=updated&direction=desc&per_page=4"
        );

        if (!response.ok) {
          throw new Error("GitHub API request failed");
        }

        const repos = await response.json();

        if (!repos.length) {
          list.innerHTML = `
            <a
              class="repo-card"
              href="https://github.com/xfwmk?tab=repositories"
              target="_blank"
              rel="noopener noreferrer"
            >
              <div class="repo-name">No repositories found</div>
            </a>
          `;
          return;
        }

        list.innerHTML = repos.slice(0, 4).map(repo => `
          <a
            class="repo-card"
            href="${repo.html_url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="repo-name">${escapeHtml(repo.name)}</div>

            ${
              repo.description
                ? `<div class="repo-description">${escapeHtml(repo.description)}</div>`
                : ""
            }

            <div class="repo-meta">
              ${repo.language ? escapeHtml(repo.language) : "Repository"}
              ${repo.stargazers_count ? ` · ★ ${repo.stargazers_count}` : ""}
            </div>
          </a>
        `).join("");

      } catch (error) {
        list.innerHTML = `
          <a
            class="repo-card"
            href="https://github.com/xfwmk?tab=repositories"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="repo-name">View repositories</div>
            <div class="repo-description">
              Unable to load repositories right now.
            </div>
          </a>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    updateAge();
    loadRepos();
  </script>

</body>
</html>
