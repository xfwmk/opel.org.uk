<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>opel.org.uk</title>

  <style>
    :root {
      color-scheme: dark;
      --text: #ffffff;
      --muted: #888888;
      --card: #0b0b0b;
      --grey: #666666;
      --grey-hover: #999999;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        #000000
        url("https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwallpapers.com%2Fimages%2Fhd%2Fabstract-black-grey-waves-background-shkpekaewx4mtd1k.jpg&f=1&nofb=1&ipt=54912c348bdb3d5c3b35a524b865013ea72a07a7129b5bd230835dc65f7378a4&ipo=images")
        center center / cover fixed no-repeat;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      padding: 30px 40px 60px;
    }

    .brand {
      display: block;
      width: fit-content;
      color: #ffffff;
      text-decoration: none;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .brand:hover,
    .brand:focus-visible {
      opacity: 0.7;
    }

    main {
      display: grid;
      grid-template-columns: 365px minmax(0, 1fr);
      gap: 50px;
      width: 100%;
      max-width: 1200px;
      padding-top: 30px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-height: 104px;
      padding: 22px 20px;
      color: #ffffff;
      background: rgba(11, 11, 11, 0.92);
      border: 3px solid var(--grey);
      border-radius: 18px;
      text-decoration: none;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      background: rgba(18, 18, 18, 0.95);
      border-color: var(--grey-hover);
      transform: translateY(-2px);
      outline: none;
    }

    .link-card:active {
      transform: translateY(0);
    }

    .icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .icon svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .guns-icon {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter:
        grayscale(1)
        brightness(0)
        invert(1);
    }

    .details {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .site-name {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .username {
      overflow: hidden;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .right-column {
      min-width: 0;
      width: 100%;
    }

    .about {
      margin-bottom: 28px;
      padding: 24px;
      background: rgba(11, 11, 11, 0.92);
      border: 3px solid var(--grey);
      border-radius: 18px;
    }

    .about-title {
      margin: 0 0 18px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .about-name {
      margin-bottom: 18px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .about-item {
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .about-label {
      margin-bottom: 5px;
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .about-value {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
    }

    .interests {
      grid-column: 1 / -1;
    }

    .languages {
      margin-bottom: 28px;
      padding: 24px;
      background: rgba(11, 11, 11, 0.92);
      border: 3px solid var(--grey);
      border-radius: 18px;
    }

    .languages-title {
      margin: 0 0 18px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .languages-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .language-group {
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .language-label {
      margin-bottom: 10px;
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .language-item {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
    }

    .language-item:first-of-type {
      margin-top: 0;
    }

    .language-logo {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: block;
      object-fit: contain;
    }

    .language-logo.svg-logo {
      width: 23px;
      height: 23px;
      filter: grayscale(1) brightness(0) invert(1);
    }

    @media (max-width: 850px) {
      .page {
        padding: 25px 25px 50px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .languages-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 20px 50px;
      }

      .brand {
        font-size: 22px;
      }

      main {
        padding-top: 24px;
      }

      .languages-grid {
        grid-template-columns: 1fr;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .interests {
        grid-column: auto;
      }

      .link-card {
        min-height: 94px;
        padding: 18px;
      }


    }
  </style>
</head>

<body>
