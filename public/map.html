<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𖦏 opel | Map</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080a0e;
    font-family: Arial, sans-serif;
  }

  #map {
    width: 100vw;
    height: 100vh;
    background: #080a0e;
  }

  .country {
    stroke: #111820;
    stroke-width: 0.5;
    vector-effect: non-scaling-stroke;
    transition: fill 0.2s ease;
    cursor: pointer;
  }

  #map-key {
   position: fixed;
   bottom: 20px;
   right: 20px;
   padding: 14px 18px;
   background: rgba(12, 16, 22, 0.92);
   border: 1px solid #252c36;
   border-radius: 8px;
   color: #dce3ec;
   font-family: Arial, sans-serif;
   font-size: 13px;
   z-index: 100;
 }

   .key-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
  }

  .key-item:first-child {
    margin-top: 0;
  }

  .key-item:last-child {
    margin-bottom: 0;
  }

  .key-colour {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    flex-shrink: 0;
  }
 
  .country.unvisited {
    fill: #30343a;
  }

  .country.visited {
    fill: #348cff;
  }

  .country.wishlist {
    fill: #123b7a;
  }

  .country:hover {
    stroke: #ffffff;
    stroke-width: 1.2;
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    display: none;
    padding: 8px 12px;
    background: rgba(10, 14, 20, 0.95);
    border: 1px solid #303946;
    border-radius: 6px;
    color: white;
    font-size: 12px;
    z-index: 10;
  }

  #error {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #aeb8c5;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>

<body>

<div id="map"></div>
<div id="map-key">
  <div class="key-item">
    <span class="key-colour" style="background: #348cff;"></span>
    <span>Visited</span>
  </div>

  <div class="key-item">
    <span class="key-colour" style="background: #123b7a;"></span>
    <span>Wishlist</span>
  </div>

  <div class="key-item">
    <span class="key-colour" style="background: #30343a;"></span>
    <span>Not visited</span>
  </div>
</div>
<div id="tooltip"></div>
<div id="error">Could not load the world map. Check your internet connection.</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script>
(() => {
  "use strict";

  const DEFAULT_VISITED = [
    'England',
    'France',
    'Spain',
    'Greece',
    'Turkey',
    'Iran',
    'Switzerland',
    'Austria',
    'Germany',
    'Italy',
    'Portugal',
    'Netherlands',
    'Poland'
  ];

  const DEFAULT_WISHLIST = [
    "Russia",
    "Canada",
    "Albania",
    "China",
    "Iceland",
    "Kazakhstan",
    "Vietnam",
    "Nepal",
    "Panama",
    "Colombia",
    "New Zealand",
    "Indonesia",
    "Chile"
  ];

  const COLORS = {
    unvisited: "#30343a",
    visited: "#348cff",
    wishlist: "#123b7a"
  };


  const aliases = {
    "uk": "united kingdom",
    "great britain": "united kingdom",
    "usa": "united states of america",
    "united states": "united states of america",
    "us": "united states of america",
    "south korea": "republic of korea",
    "north korea": "democratic people's republic of korea",
    "russia": "russian federation",
    "czech republic": "czechia",
    "ivory coast": "côte d'ivoire",
    "vietnam": "viet nam",
    "turkey": "türkiye"
  };

  function normalize(name) {
    const value = String(name || "")
      .trim()
      .toLowerCase();

    return aliases[value] || value;
  }

  const visited = new Set(
    DEFAULT_VISITED.map(normalize)
  );

  const wishlist = new Set(
    DEFAULT_WISHLIST.map(normalize)
  );

  const container = d3.select("#map");
  const tooltip = d3.select("#tooltip");

  const width = window.innerWidth;
  const height = window.innerHeight;

  const svg = container
    .append("svg")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", `0 0 ${width} ${height}`)
    .style("display", "block");

  const layer = svg.append("g");

  const projection = d3.geoNaturalEarth1();

  const path = d3.geoPath(projection);

  const geojsonURL =
    "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson";

  function countryStatus(name) {
    const key = normalize(name);

    if (visited.has(key)) {
      return "visited";
    }

    if (wishlist.has(key)) {
      return "wishlist";
    }

    return "unvisited";
  }

  function countryName(feature) {
    return (
      feature.properties.name ||
      feature.properties.ADMIN ||
      "Unknown country"
    );
  }

  function resizeMap(geojson) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    svg
      .attr("width", w)
      .attr("height", h)
      .attr("viewBox", `0 0 ${w} ${h}`);

    projection.fitExtent(
      [
        [20, 20],
        [w - 20, h - 20]
      ],
      geojson
    );

    layer
      .selectAll("path")
      .attr("d", path);
  }

  d3.json(geojsonURL)
    .then(geojson => {

      resizeMap(geojson);

      layer
        .selectAll("path")
        .data(geojson.features)
        .enter()
        .append("path")
        .attr("class", feature => {
          return "country " +
            countryStatus(countryName(feature));
        })
        .attr("d", path)

        .on("mousemove", function(event, feature) {
          const name = countryName(feature);
          const status = countryStatus(name);

          const label =
            status === "visited"
              ? "Visited"
              : status === "wishlist"
              ? "Wishlist"
              : "Not visited";

          tooltip
            .style("display", "block")
            .style("left", (event.clientX + 14) + "px")
            .style("top", (event.clientY + 14) + "px")
            .html(
              `<strong>${name}</strong><br>${label}`
            );
        })

        .on("mouseleave", function() {
          tooltip.style("display", "none");
        });

      const zoom = d3.zoom()
        .scaleExtent([1, 8])
        .on("zoom", event => {
          layer.attr("transform", event.transform);
        });

      svg.call(zoom);

      window.addEventListener("resize", () => {
        resizeMap(geojson);
      });
    })
    .catch(error => {
      console.error("Map loading error:", error);
      document.getElementById("error").style.display = "block";
    });

})();
</script>

</body>
</html>
