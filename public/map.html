<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>𖦏 opel</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#101722;--line:#253041;--text:#edf3fa;--muted:#8e9aab;--blue:#348cff;--land:#30343a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:32px 24px;display:flex;flex-direction:column;gap:23px;z-index:2}
.eyebrow{color:#70aaff;letter-spacing:.22em;text-transform:uppercase;font-size:10px;font-weight:800}.title{font-size:34px;line-height:1.05;letter-spacing:-1.6px;font-weight:800;margin:8px 0 10px}.subtitle{color:var(--muted);font-size:13px;line-height:1.65;margin:0}
.stats{display:flex;align-items:end;gap:10px;padding:17px 0;border-block:1px solid var(--line)}.count{font-size:50px;font-weight:800;line-height:1;letter-spacing:-2px}.statlabel{font-size:12px;color:var(--muted);padding-bottom:6px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:10px}.hint{color:var(--muted);font-size:11px;line-height:1.5;margin:8px 0 0}
textarea{width:100%;height:250px;resize:vertical;border:1px solid #334258;border-radius:12px;background:#0a1019;color:#edf3fa;padding:13px 14px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none}textarea:focus{border-color:#348cff;box-shadow:0 0 0 3px #348cff22}
.actions{display:flex;gap:8px;margin-top:10px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:white;flex:1}.secondary{background:#253143;color:#e5edf8}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:7px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--land)}.dot.blue{background:var(--blue)}.footer{margin-top:auto;font-size:11px;line-height:1.6;color:#778599}
.maparea{position:relative;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(ellipse at 52% 48%,#152133 0%,#0b1019 55%,#080b11 100%)}.maphead{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:28px 35px 0}.maphead h2{font-size:15px;letter-spacing:.01em;margin:0}.maphead small{color:var(--muted);font-size:11px}.mapwrap{flex:1;position:relative;min-height:430px}svg{display:block;width:100%;height:100%;touch-action:none}.country{fill:var(--land);stroke:#17212d;stroke-width:.55;vector-effect:non-scaling-stroke;cursor:default;transition:fill .18s}.country.visited{fill:var(--blue)}.country:hover{fill:#717a88;stroke:#e7f3ff;stroke-width:1.3}.country.visited:hover{fill:#65a9ff}.tooltip{position:absolute;pointer-events:none;display:none;padding:8px 11px;border:1px solid #3a5069;border-radius:8px;background:#101a29eF;color:#fff;font-size:12px;box-shadow:0 10px 30px #0007;white-space:nowrap;z-index:3}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#9aaabd;font-size:13px;text-align:center;padding:30px}.mapfoot{padding:0 35px 25px;display:flex;align-items:center;justify-content:space-between;gap:12px}.zoom{display:flex;gap:7px}.zoom button{padding:8px 12px;background:#1a2637;color:white}.error{color:#ff9999}.small{font-size:11px;color:var(--muted)}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:23px 20px;gap:16px}.title{font-size:27px}.stats{padding:10px 0}.count{font-size:37px}textarea{height:105px}.maparea{min-height:480px}.maphead{padding:18px 20px 0}.mapfoot{padding:0 20px 20px}.mapwrap{min-height:350px}}
</style>
</head>
<body>
<div class="app">
<main class="maparea">
 <div class="maphead"><h2>𖦏 opel</h2><small>Blue marks the places I've explored</small></div>
 <div class="mapwrap" id="mapwrap"><svg id="map" aria-label="World map highlighting visited countries" role="img"></svg><div id="loading" class="loading">Loading world map…</div><div id="tooltip" class="tooltip"></div></div>
 <div class="mapfoot"><span id="status" class="small">Grey: not visited · Blue: visited</span><div class="zoom"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomReset" aria-label="Reset zoom">Reset view</button></div></div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>

const DEFAULT_VISITED = [
  'United Kingdom',
  'France',
  'Spain',
  'Greece',
  'Turkey',
  'Iran',
  'Switzerland',
  'Austria',
  'Germany',
  'Italy',
  'Portugal',
  'Netherlands',
  'Poland'
];

const ALIASES = {
 'uk':'united kingdom','great britain':'united kingdom','britain':'united kingdom','england':'united kingdom','scotland':'united kingdom','wales':'united kingdom',
 'usa':'united states of america','us':'united states of america','united states':'united states of america','america':'united states of america',
 'uae':'united arab emirates','south korea':'republic of korea','north korea':'democratic peoples republic of korea',
 'russia':'russian federation','vietnam':'viet nam','czech republic':'czechia','ivory coast':'cote divoire',
 'turkey':'turkiye','türkiye':'turkiye','burma':'myanmar','swaziland':'eswatini',
 'dr congo':'democratic republic of the congo','drc':'democratic republic of the congo','congo kinshasa':'democratic republic of the congo',
 'republic of congo':'republic of the congo','congo brazzaville':'republic of the congo',
 'palestine':'palestine','taiwan':'taiwan'
};
const normalize = value => {
 const key = String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
 for (const [alias, canonical] of Object.entries(ALIASES)) {
   if (alias.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'') === key)
     return canonical.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
 }
 return key;
};
let visited = new Set();
let shapes = null;
let geoFeatures = [];
function currentNames(){return DEFAULT_VISITED.map(x=>String(x).trim()).filter(Boolean)}
function updateMap(){
 const names = currentNames();
 visited = new Set(names.map(normalize));
 if (shapes) shapes.classed('visited', d=>visited.has(normalize(countryName(d))));
 const matched = new Set(geoFeatures.filter(d=>visited.has(normalize(countryName(d)))).map(d=>normalize(countryName(d))));
 if (geoFeatures.length) {
   const unmatched = [...visited].filter(name=>!matched.has(name));
   document.getElementById('status').textContent = unmatched.length ? `Not found on map: ${names.filter(n=>unmatched.includes(normalize(n))).join(', ')}` : 'Grey: not visited · Blue: visited';
 }
}
function countryName(feature){const p=feature.properties||{};return p.ADMIN||p.name||p.NAME||p.NAME_EN||p.SOVEREIGNT||'Unknown';}
updateMap();
(async function(){
 const loading=document.getElementById('loading');
 if(!window.d3){loading.innerHTML='<span class="error">Could not load the map library. Check your internet connection.</span>';return;}
 const svg=d3.select('#map');
 const wrap=document.getElementById('mapwrap');
 const tooltip=document.getElementById('tooltip');
 const layer=svg.append('g');
 let projection, path, zoom;
 function fit(){
   const width=wrap.clientWidth,height=wrap.clientHeight;
   svg.attr('viewBox',`0 0 ${width} ${height}`);
   projection=d3.geoNaturalEarth1().fitExtent([[12,18],[width-12,height-18]],{type:'Sphere'});
   path=d3.geoPath(projection);
   if(shapes)shapes.attr('d',path);
 }
 try {
   const response=await fetch('https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson');
   if(!response.ok)throw new Error('HTTP '+response.status);
   const geojson=await response.json();
   if(!Array.isArray(geojson.features))throw new Error('Invalid country data');
   geoFeatures=geojson.features;
   fit();
   shapes=layer.selectAll('path').data(geoFeatures).join('path').attr('class','country').attr('d',path)
     .on('pointermove',function(event,d){
       tooltip.style.display='block';tooltip.textContent=countryName(d)+(visited.has(normalize(countryName(d)))?' · Visited':'');
       const bounds=wrap.getBoundingClientRect();
       tooltip.style.left=Math.min(event.clientX-bounds.left+12,bounds.width-tooltip.offsetWidth-8)+'px';
       tooltip.style.top=Math.max(8,event.clientY-bounds.top-35)+'px';
     })
     .on('pointerleave',()=>tooltip.style.display='none');
   zoom=d3.zoom().scaleExtent([1,9]).on('zoom',e=>layer.attr('transform',e.transform));
   svg.call(zoom);
   document.getElementById('zoomIn').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.5);
   document.getElementById('zoomOut').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.5);
   document.getElementById('zoomReset').onclick=()=>svg.transition().duration(250).call(zoom.transform,d3.zoomIdentity);
   new ResizeObserver(()=>fit()).observe(wrap);
   loading.style.display='none';
   updateMap();
 } catch(error){loading.innerHTML='<span class="error">Unable to load country borders.<br>Check your internet connection and reload.<br><small>'+String(error.message).replace(/[<>&]/g,'')+'</small></span>';}
})();
</script>
</body>
</html>
